[package]
name = "beefetch"
version = "3.0.0"
edition = "2024"
description = "Neofetch clone written in Rust with the ability to display 🐝"
license = "GPL-3.0-only"
repository = "https://github.com/mirdukkkkk/beefetch"

[dependencies]
bpaf = { version = "0.9.28", features = ["derive", "autocomplete"] }

# Manpage rendering is only needed by the test that regenerates docs/beefetch.1.
[dev-dependencies]
bpaf = { version = "0.9.28", features = ["docgen"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
