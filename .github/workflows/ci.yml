name: ci

on:
  push:
    branches: [main, next]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - run: nix flake check
      - run: nix build --print-build-logs

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, name: linux-amd64 }
          - { target: i686-unknown-linux-musl, name: linux-386 }
          - { target: aarch64-unknown-linux-musl, name: linux-arm64 }
          - { target: armv7-unknown-linux-musleabihf, name: linux-armv7 }
          - { target: arm-unknown-linux-musleabihf, name: linux-armv6 }
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - run: cross build --locked --release --target ${{ matrix.target }}
      - run: cp target/${{ matrix.target }}/release/beefetch beefetch-${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: beefetch-${{ matrix.name }}
          path: beefetch-${{ matrix.name }}

  # Release notes come from the annotated tag message.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # checkout turns annotated tags into lightweight ones; refetch to keep the message.
      - run: git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
        env:
          TAG: ${{ github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "$TAG" dist/* --title "🐝 - $TAG" --notes-from-tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
