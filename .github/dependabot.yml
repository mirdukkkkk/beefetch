version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      cargo:
        patterns:
          - "*"

  # Bumps flake.lock inputs; the `nix` CI job checks the flake still builds.
  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      # Every action bump in one weekly PR; a broken one shows up in that PR's CI run.
      actions:
        patterns:
          - "*"
